# Built-in defaults; command-line options override them.
name=Eclipse SDK
applicationUrl.win32=https://download.eclipse.org/eclipse/downloads/drops4/I20260928-2300/eclipse-SDK-I20260928-2300-win32-win32-x86_64.zip
applicationUrl.linux=https://download.eclipse.org/eclipse/downloads/drops4/I20260928-2300/eclipse-SDK-I20260928-2300-linux-gtk-x86_64.tar.gz
target=${user.home}/eclipse/sdk
repositories=https://download.eclipse.org/releases/2026-06,\
             https://download.eclipse.org/egit/updates-nightly/,\
             https://vogellacompany.github.io/eclipse-themes/
features=org.eclipse.egit.feature.group,\
         com.vogella.eclipse.themes.feature.feature.group
# Feature names come from the update sites; label.<feature id>=... overrides one.
# The published installer, checked at startup for a newer release.
releasePage=https://github.com/vogellacompany/eclipse-installer/releases/latest
installerUrl.win32=https://github.com/vogellacompany/eclipse-installer/releases/latest/download/eclipse-installer-win32.win32.x86_64.zip
installerUrl.linux=https://github.com/vogellacompany/eclipse-installer/releases/latest/download/eclipse-installer-linux.gtk.x86_64.tar.gz
